<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Matrix Multiplication Challenge</title><style>:root{--primary:#2563eb;--success:#16a34a;--danger:#dc2626;--bg:#f5f7fb;--card:#fff;--text:#1e293b}.dark{--primary:#60a5fa;--success:#22c55e;--danger:#ef4444;--bg:#0f172a;--card:#1e293b;--text:#f8fafc}*{box-sizing:border-box}body{font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text);padding:20px;transition:.3s}#confettiCanvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999}.container{max-width:1000px;margin:auto}.card{background:var(--card);border-radius:20px;padding:45px;box-shadow:0 10px 30px rgba(0,0,0,.08)}h1{text-align:center;color:var(--primary)}.subtitle{text-align:center;color:#64748b}.stats,.button-row,.difficulty,.matrix-layout{display:flex;justify-content:center;gap:28px;flex-wrap:wrap;margin:32px 0}.stat{background:#eef2ff;padding:10px 15px;border-radius:10px}.matrix-wrapper{position:relative;padding:10px 25px}.matrix-wrapper:before,.matrix-wrapper:after{position:absolute;top:50%;transform:translateY(-50%);font-size:70px}.matrix-wrapper:before{content:'[';left:0}.matrix-wrapper:after{content:']';right:0}.matrix{display:grid;gap:10px}.cell{text-align:center;min-width:60px;padding:8px;font-size:1.5rem;font-weight:600}.symbol{font-size:2rem;font-weight:bold}.answer-grid{display:grid;gap:8px;justify-content:center}.answer-grid input{width:60px;height:50px;text-align:center;background:var(--card);color:var(--text);border:1px solid #cbd5e1;border-radius:8px}button{padding:14px 24px;border:none;border-radius:12px;background:var(--primary);color:#fff;cursor:pointer;font-weight:600;box-shadow:0 4px 10px rgba(37,99,235,.2)}.message,.solution{display:none;margin-top:30px;padding:20px;border-radius:10px}.correct{background:#dcfce7;color:#166534}.incorrect{background:#fee2e2;color:#991b1b}@media(max-width:700px){.matrix-layout,.button-row{flex-direction:column}}</style></head><body><div class="container"><div class="card"><h1>🧮 Matrix Multiplication Challenge</h1><p class="subtitle">Generate random matrix products and test your skills.</p><div class="stats"><div class="stat">Correct: <span id="correct">0</span></div><div class="stat">Incorrect: <span id="incorrect">0</span></div><div class="stat">Accuracy: <span id="accuracy">0</span>%</div></div><div class="stats"><div class="stat">Quiz: <span id="quizScore">0/0</span></div><div class="stat">Time: <span id="timer">60</span>s</div></div><div class="difficulty"><button style='background:#16a34a' onclick="setDifficulty('easy')">Easy</button><button style='background:#f59e0b' onclick="setDifficulty('medium')">Medium</button><button style='background:#dc2626' onclick="setDifficulty('hard')">Hard</button></div><div class="matrix-layout"><div id="matrixA"></div><div class="symbol">×</div><div id="matrixB"></div><div class="symbol">=</div><div id="answerInputs"></div></div><div class="button-row"><button onclick="checkAnswer()">Check Answer</button><button onclick="toggleSolution()">Show / Hide Solution</button><button onclick="startQuiz()">10 Question Quiz</button><button onclick="generateQuestion()">New Question</button><button onclick="toggleDarkMode()">🌙 Dark Mode</button></div><div id="message" class="message"></div><div id="solution" class="solution"></div></div></div><div id="history" style="margin-top:30px"><h3>Question History</h3><ul id="historyList"></ul></div><canvas id="progressCanvas" width="400" height="120" style="margin-top:20px;border:1px solid #ccc;border-radius:8px"></canvas><script>let matrixA=[],matrixB=[],answer=[],difficulty='easy',correct=0,incorrect=0;let streak=0,best=Number(localStorage.getItem('bestStreak')||0);document.querySelector('.stats').insertAdjacentHTML('beforeend','<div class="stat">Streak: <span id="streak">0</span></div><div class="stat">Best: <span id="best">'+best+'</span></div>');function random(a,b){return Math.floor(Math.random()*(b-a+1))+a}function setDifficulty(d){difficulty=d;generateQuestion()}function createMatrix(r,c,min,max){return Array.from({length:r},()=>Array.from({length:c},()=>random(min,max)))}function multiply(A,B){let R=[];for(let i=0;i<A.length;i++){R[i]=[];for(let j=0;j<B[0].length;j++){let s=0;for(let k=0;k<B.length;k++)s+=A[i][k]*B[k][j];R[i][j]=s}}return R}function displayMatrix(m,id){let w=document.createElement('div');w.className='matrix-wrapper';let g=document.createElement('div');g.className='matrix';g.style.gridTemplateColumns='repeat('+m[0].length+',auto)';m.flat().forEach(v=>{let c=document.createElement('div');c.className='cell';c.textContent=v;g.appendChild(c)});w.appendChild(g);let d=document.getElementById(id);d.innerHTML='';d.appendChild(w)}function createAnswerGrid(r,c){let d=document.getElementById('answerInputs');d.className='answer-grid';d.style.gridTemplateColumns='repeat('+c+',60px)';d.innerHTML='';for(let i=0;i<r;i++)for(let j=0;j<c;j++){let b=document.createElement('input');b.type='number';b.dataset.row=i;b.dataset.col=j;d.appendChild(b)}}function generateQuestion(){let min,max,rA,cA,rB,cB;if(difficulty==='hard'){rA=2;cA=3;rB=3;cB=2;min=-9;max=9}else if(difficulty==='medium'){rA=cA=rB=cB=2;min=-5;max=9}else{rA=cA=rB=cB=2;min=0;max=5}matrixA=createMatrix(rA,cA,min,max);matrixB=createMatrix(rB,cB,min,max);answer=multiply(matrixA,matrixB);displayMatrix(matrixA,'matrixA');displayMatrix(matrixB,'matrixB');createAnswerGrid(answer.length,answer[0].length);document.getElementById('message').style.display='none';document.getElementById('solution').style.display='none'}function updateStats(){let t=correct+incorrect;document.getElementById('correct').textContent=correct;document.getElementById('incorrect').textContent=incorrect;document.getElementById('accuracy').textContent=t?Math.round(correct/t*100):0}function checkAnswer(){let ok=true;document.querySelectorAll('#answerInputs input').forEach(i=>{if(Number(i.value)!==answer[i.dataset.row][i.dataset.col])ok=false});let m=document.getElementById('message');if(ok){correct++;streak++;if(streak>best){best=streak;localStorage.setItem('bestStreak',best)};document.getElementById('streak').textContent=streak;document.getElementById('best').textContent=best;m.className='message correct';m.innerHTML='✓ Correct! Excellent work!';}else{incorrect++;streak=0;document.getElementById('streak').textContent=0;m.className='message incorrect';m.textContent='✗ Not quite. Try again or view the solution.'}m.style.display='block';updateStats()}function toggleSolution(){let d=document.getElementById('solution');if(d.style.display==='block'){d.style.display='none';return}let h='<h3>Worked Solution</h3>';for(let i=0;i<answer.length;i++)for(let j=0;j<answer[0].length;j++){let t=[];for(let k=0;k<matrixB.length;k++)t.push('('+matrixA[i][k]+' × '+matrixB[k][j]+')');h+='<p>Cell ('+(i+1)+','+(j+1)+'): '+t.join(' + ')+' = <strong>'+answer[i][j]+'</strong></p>'}d.innerHTML=h;d.style.display='block'}function toggleDarkMode(){document.body.classList.toggle('dark');localStorage.setItem('darkMode',document.body.classList.contains('dark'))}if(localStorage.getItem('darkMode')==='true')document.body.classList.add('dark');let quizAnswered=0,quizCorrect=0,timeLeft=60;function startQuiz(){quizAnswered=0;quizCorrect=0;updateQuiz();timeLeft=60;clearInterval(window.qt);window.qt=setInterval(()=>{timeLeft--;document.getElementById('timer').textContent=timeLeft;if(timeLeft<=0){clearInterval(window.qt);alert(`Quiz complete! Score: ${quizCorrect}/10`) }},1000)}function updateQuiz(){document.getElementById('quizScore').textContent=quizCorrect+'/'+quizAnswered}function exportResults(){let csv="Correct,Incorrect
"+correct+","+incorrect;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv]));a.download='matrix-results.csv';a.click()}document.addEventListener('keydown',e=>{if(e.key==='Enter')checkAnswer()});document.addEventListener('input',e=>{if(e.target.closest('#answerInputs')){let inputs=[...document.querySelectorAll('#answerInputs input')];let i=inputs.indexOf(e.target);if(i<inputs.length-1&&e.target.value!=='')inputs[i+1].focus()}});const oldCheck=checkAnswer;checkAnswer=function(){let before=correct;oldCheck();quizAnswered++;if(correct>before)quizCorrect++;updateQuiz();let li=document.createElement('li');li.textContent=`${difficulty} | ${correct}/${correct+incorrect}`;document.getElementById('historyList').prepend(li);let c=document.getElementById('progressCanvas'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);x.fillStyle="#2563eb";x.fillRect(20,100-correct*8,40,correct*8);x.fillStyle="#dc2626";x.fillRect(80,100-incorrect*8,40,incorrect*8)};generateQuestion();</script></body></html>
