<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matrix Multiplication Practice</title>

<style>
body{
    font-family:Segoe UI,Arial,sans-serif;
    max-width:1200px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
}

.controls{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    justify-content:center;
    margin-bottom:25px;
}

button,
select{
    padding:10px;
    font-size:16px;
}

button{
    cursor:pointer;
}

.score{
    font-weight:bold;
}

.question-area{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:30px;
    margin:30px 0;
}

.multiply{
    font-size:40px;
    font-weight:bold;
}

.matrix{
    display:flex;
    align-items:stretch;
}

.left-bracket{
    width:12px;
    border-left:4px solid black;
    border-top:4px solid black;
    border-bottom:4px solid black;
    margin-right:8px;
}

.right-bracket{
    width:12px;
    border-right:4px solid black;
    border-top:4px solid black;
    border-bottom:4px solid black;
    margin-left:8px;
}

table{
    border-collapse:collapse;
}

td{
    padding:8px 12px;
    text-align:center;
    font-size:20px;
}

.answer-box{
    width:65px;
    height:40px;
    text-align:center;
    font-size:18px;
}

.correct{
    background:#c8f7c5;
    border:2px solid green;
}

.incorrect{
    background:#ffc7c7;
    border:2px solid red;
}

.result{
    text-align:center;
    margin-top:20px;
    font-size:20px;
    font-weight:bold;
}

.solution{
    display:none;
    margin-top:30px;
    border-top:1px solid #ccc;
    padding-top:20px;
}

.entry{
    margin-bottom:6px;
}
</style>

</head>
<body>

<h1>Matrix Multiplication Practice</h1>

<div class="controls">

<select id="questionType">
<option value="0">2×2 by 2×1</option>
<option value="1">2×2 by 2×2</option>
<option value="2">3×3 by 3×1</option>
<option value="3">3×3 by 3×2</option>
<option value="4">3×3 by 3×3</option>
</select>

<button onclick="newQuestion()">
New Question
</button>

<button onclick="checkAnswer()">
Check Answer
</button>

<button onclick="toggleSolution()">
Show / Hide Worked Solution
</button>

<div class="score">
Score:
<span id="score">0</span>
/
<span id="attempts">0</span>
</div>

</div>

<div id="questionArea"></div>

<h2>Your Answer</h2>

<div id="answerArea"></div>

<div id="result" class="result"></div>

<div id="solution" class="solution">
<h2>Worked Solution</h2>

<div id="working"></div>

<h3>Correct Answer</h3>

<div id="correctAnswer"></div>
</div>

<script>

const questionTypes = [
    {a:[2,2], b:[2,1]},
    {a:[2,2], b:[2,2]},
    {a:[3,3], b:[3,1]},
    {a:[3,3], b:[3,2]},
    {a:[3,3], b:[3,3]}
];

let matrixA = [];
let matrixB = [];
let answerMatrix = [];

let score = 0;
let attempts = 0;

function randomMatrix(rows, cols){

    return Array.from(
        {length:rows},
        () =>
        Array.from(
            {length:cols},
            () => Math.floor(Math.random()*11)-5
        )
    );
}

function multiply(A,B){

    const result = [];

    for(let r=0;r<A.length;r++){

        const row = [];

        for(let c=0;c<B[0].length;c++){

            let total = 0;

            for(let k=0;k<B.length;k++){
                total += A[r][k] * B[k][c];
            }

            row.push(total);
        }

        result.push(row);
    }

    return result;
}

function matrixHTML(matrix){

    let html = `
    <div class="matrix">
      <div class="left-bracket"></div>
      <table>
    `;

    matrix.forEach(row => {

      html += "<tr>";

      row.forEach(value => {
        html += `<td>${value}</td>`;
      });

      html += "</tr>";

    });

    html += `
      </table>
      <div class="right-bracket"></div>
    </div>
    `;

    return html;
}

function answerGridHTML(matrix){

    let html = `
    <div class="matrix">
      <div class="left-bracket"></div>
      <table>
    `;

    matrix.forEach((row,r)=>{

        html += "<tr>";

        row.forEach((cell,c)=>{

            html += `
            <td>
            <input
              type="text"
              class="answer-box"
              id="cell-${r}-${c}"
              autocomplete="off"
              spellcheck="false">
            </td>
            `;

        });

        html += "</tr>";
    });

    html += `
      </table>
      <div class="right-bracket"></div>
    </div>
    `;

    return html;
}

function newQuestion(){

    const config =
    questionTypes[
      Number(
        document.getElementById("questionType").value
      )
    ];

    matrixA =
    randomMatrix(config.a[0],config.a[1]);

    matrixB =
    randomMatrix(config.b[0],config.b[1]);

    answerMatrix =
    multiply(matrixA,matrixB);

    document.getElementById("questionArea").innerHTML =
    `
    <div class="question-area">
      ${matrixHTML(matrixA)}
      <div class="multiply">×</div>
      ${matrixHTML(matrixB)}
    </div>
    `;

    document.getElementById("answerArea").innerHTML =
    answerGridHTML(answerMatrix);

    document.getElementById("result").textContent = "";

    document.getElementById("solution").style.display =
    "none";

    buildSolution();
}

function checkAnswer(){

    let allCorrect = true;

    answerMatrix.forEach((row,r)=>{

        row.forEach((value,c)=>{

            const box =
            document.getElementById(
              `cell-${r}-${c}`
            );

            const entered =
            Number(box.value);

            box.classList.remove(
                "correct",
                "incorrect"
            );

            if(entered === value){

                box.classList.add("correct");

            } else {

                box.classList.add("incorrect");
                allCorrect = false;
            }

        });

    });

    attempts++;

    document.getElementById("attempts").textContent =
    attempts;

    if(allCorrect){

        score++;

        document.getElementById("score").textContent =
        score;

        document.getElementById("result").textContent =
        "✅ Correct";

    }else{

        document.getElementById("result").textContent =
        "❌ Some answers are incorrect";
    }
}

function buildSolution(){

    let html = "";

    answerMatrix.forEach((row,r)=>{

        row.forEach((value,c)=>{

            const working =
            matrixA[r]
            .map(
                (a,k)=>
                `${a} × ${matrixB[k][c]}`
            )
            .join(" + ");

            html += `
            <div class="entry">
            Entry (${r+1},${c+1})
            = ${working}
            = <strong>${value}</strong>
            </div>
            `;
        });

    });

    document.getElementById("working").innerHTML =
    html;

    document.getElementById("correctAnswer").innerHTML =
    matrixHTML(answerMatrix);
}

function toggleSolution(){

    const solution =
    document.getElementById("solution");

    if(solution.style.display === "block"){

        solution.style.display = "none";

    }else{

        solution.style.display = "block";
    }
}

document
.getElementById("questionType")
.addEventListener(
    "change",
    newQuestion
);

newQuestion();

</script>

</body>
</html>
