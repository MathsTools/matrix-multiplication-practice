<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matrix Multiplication Challenge</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#1e293b;--primary:#2563eb;--easy:#16a34a;--medium:#f59e0b;--hard:#dc2626}
body.dark{--bg:#0f172a;--card:#1e293b;--text:#f8fafc;--primary:#60a5fa}
body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,sans-serif;padding:24px;transition:.3s}
.card{max-width:1100px;margin:auto;background:var(--card);padding:40px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.1)}
h1{text-align:center;color:var(--primary)}
.stats,.difficulty,.controls,.matrix-layout{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin:28px 0}
.stat{padding:12px 16px;background:rgba(37,99,235,.12);border-radius:10px}
button{padding:14px 22px;border:none;border-radius:12px;color:white;font-weight:700;cursor:pointer}
.btn{background:var(--primary)} .easy{background:var(--easy)} .medium{background:var(--medium)} .hard{background:var(--hard)}
.matrix-wrapper{position:relative;padding:10px 28px}.matrix-wrapper:before,.matrix-wrapper:after{position:absolute;top:50%;transform:translateY(-50%);font-size:90px}.matrix-wrapper:before{content:'[';left:0}.matrix-wrapper:after{content:']';right:0}
.matrix{display:grid;gap:10px}.cell{min-width:60px;text-align:center;font-size:1.4rem;font-weight:600}
.symbol{font-size:2rem;font-weight:700;align-self:center}.answer-grid{display:grid;gap:10px}.answer-grid input{width:60px;height:55px;text-align:center;font-size:1.2rem}
#message,#solution{margin-top:25px;padding:18px;border-radius:12px;display:none}#history li{margin:6px 0}
canvas{border:1px solid #ccc;border-radius:8px;max-width:100%}
@media(max-width:700px){.matrix-layout,.controls{flex-direction:column;align-items:center}}
</style>
</head><body><div class="card"><h1>🧮 Matrix Multiplication Challenge</h1>
<div class="stats"><div class='stat'>Correct: <span id='correct'>0</span></div><div class='stat'>Incorrect: <span id='incorrect'>0</span></div><div class='stat'>Accuracy: <span id='accuracy'>0</span>%</div><div class='stat'>Streak: <span id='streak'>0</span></div><div class='stat'>Best: <span id='best'>0</span></div><div class='stat'>Quiz: <span id='quiz'>0/10</span></div><div class='stat'>Time: <span id='timer'>60</span>s</div></div>
<div class='difficulty'><button class='easy' onclick="setDifficulty('easy')">Easy</button><button class='medium' onclick="setDifficulty('medium')">Medium</button><button class='hard' onclick="setDifficulty('hard')">Hard</button></div>
<div class='matrix-layout'><div id='A'></div><div class='symbol'>×</div><div id='B'></div><div class='symbol'>=</div><div id='inputs'></div></div>
<div class='controls'><button class='btn' onclick='checkAnswer()'>Check Answer</button><button class='btn' onclick='toggleSolution()'>Show / Hide Solution</button><button class='btn' onclick='generateQuestion()'>New Question</button><button class='btn' onclick='toggleDark()'>Dark Mode</button><button class='btn' onclick='startQuiz()'>Start Quiz</button></div>
<div id='message'></div><div id='solution'></div>
<h3>Question History</h3><ul id='history'></ul>
<canvas id='chart' width='400' height='120'></canvas></div>
<script>
let A,B,ans,difficulty='easy',correct=0,incorrect=0,streak=0,best=Number(localStorage.getItem('best')||0),quizCount=0,quizCorrect=0,timer=60,interval;
document.getElementById('best').textContent=best;
function r(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function setDifficulty(d){difficulty=d;generateQuestion()}
function make(rows,cols,min,max){return Array.from({length:rows},()=>Array.from({length:cols},()=>r(min,max)))}
function mult(X,Y){let R=[];for(let i=0;i<X.length;i++){R[i]=[];for(let j=0;j<Y[0].length;j++){let s=0;for(let k=0;k<Y.length;k++)s+=X[i][k]*Y[k][j];R[i][j]=s}}return R}
function show(m,id){let w=document.createElement('div');w.className='matrix-wrapper';let g=document.createElement('div');g.className='matrix';g.style.gridTemplateColumns=`repeat(${m[0].length},auto)`;m.flat().forEach(v=>{let c=document.createElement('div');c.className='cell';c.textContent=v;g.appendChild(c)});w.appendChild(g);document.getElementById(id).replaceChildren(w)}
function generateQuestion(){let min,max,ra,ca,rb,cb;if(difficulty==='hard'){ra=2;ca=3;rb=3;cb=2;min=-9;max=9}else if(difficulty==='medium'){ra=ca=rb=cb=2;min=-5;max=9}else{ra=ca=rb=cb=2;min=0;max=5}A=make(ra,ca,min,max);B=make(rb,cb,min,max);ans=mult(A,B);show(A,'A');show(B,'B');let d=document.getElementById('inputs');d.className='answer-grid';d.style.gridTemplateColumns=`repeat(${ans[0].length},60px)`;d.innerHTML='';for(let i=0;i<ans.length;i++)for(let j=0;j<ans[0].length;j++){let x=document.createElement('input');x.dataset.r=i;x.dataset.c=j;d.appendChild(x)};document.getElementById('message').style.display='none';document.getElementById('solution').style.display='none';}
function update(){document.getElementById('correct').textContent=correct;document.getElementById('incorrect').textContent=incorrect;document.getElementById('streak').textContent=streak;document.getElementById('accuracy').textContent=(correct+incorrect)?Math.round(correct*100/(correct+incorrect)):0;draw()}
function checkAnswer(){let ok=true;document.querySelectorAll('#inputs input').forEach(i=>{if(Number(i.value)!==ans[i.dataset.r][i.dataset.c]) ok=false});let m=document.getElementById('message');m.style.display='block';if(ok){correct++;streak++;quizCorrect++;if(streak>best){best=streak;localStorage.setItem('best',best);document.getElementById('best').textContent=best}m.style.background='#dcfce7';m.textContent='✓ Correct!';}else{incorrect++;streak=0;m.style.background='#fee2e2';m.textContent='✗ Incorrect';}quizCount++;document.getElementById('quiz').textContent=quizCount+'/10';let li=document.createElement('li');li.textContent=`${difficulty}: ${ok?'Correct':'Incorrect'}`;history.prepend(li);update()}
function toggleSolution(){let s=document.getElementById('solution');if(s.style.display==='block'){s.style.display='none';return;}let h='<h3>Worked Solution</h3>';for(let i=0;i<ans.length;i++)for(let j=0;j<ans[0].length;j++){let p=[];for(let k=0;k<B.length;k++)p.push(`(${A[i][k]}×${B[k][j]})`);h+=`<p>${p.join(' + ')} = <b>${ans[i][j]}</b></p>`}s.innerHTML=h;s.style.display='block';}
function toggleDark(){document.body.classList.toggle('dark')}
function startQuiz(){quizCount=0;quizCorrect=0;timer=60;clearInterval(interval);interval=setInterval(()=>{timer--;document.getElementById('timer').textContent=timer;if(timer<=0){clearInterval(interval);alert('Quiz finished. Score: '+quizCorrect+'/'+quizCount)}},1000)}
document.addEventListener('keydown',e=>{if(e.key==='Enter')checkAnswer()})
document.addEventListener('input',e=>{if(e.target.closest('#inputs')&&e.target.value){let a=[...document.querySelectorAll('#inputs input')];let i=a.indexOf(e.target);if(i<a.length-1)a[i+1].focus()}})
function draw(){let c=document.getElementById('chart'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);x.fillStyle='#16a34a';x.fillRect(100,110-correct*8,60,correct*8);x.fillStyle='#dc2626';x.fillRect(240,110-incorrect*8,60,incorrect*8);x.fillStyle='#000';x.fillText('Correct',95,118);x.fillText('Incorrect',230,118)}
generateQuestion();update();
</script></body></html>
