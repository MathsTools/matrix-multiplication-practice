<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Matrix Multiplication Challenge</title><style>:root{--primary:#2563eb;--success:#16a34a;--danger:#dc2626;--bg:#f5f7fb;--card:#fff;--text:#1e293b}.dark{--primary:#60a5fa;--success:#22c55e;--danger:#ef4444;--bg:#0f172a;--card:#1e293b;--text:#f8fafc}*{box-sizing:border-box}body{font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text);padding:20px;transition:.3s}#confettiCanvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999}.container{max-width:1000px;margin:auto}.card{background:var(--card);border-radius:20px;padding:30px;box-shadow:0 10px 30px rgba(0,0,0,.08)}h1{text-align:center;color:var(--primary)}.subtitle{text-align:center;color:#64748b}.stats,.button-row,.difficulty,.matrix-layout{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.stat{background:#eef2ff;padding:10px 15px;border-radius:10px}.matrix-wrapper{position:relative;padding:10px 25px}.matrix-wrapper:before,.matrix-wrapper:after{position:absolute;top:50%;transform:translateY(-50%);font-size:70px}.matrix-wrapper:before{content:'[';left:0}.matrix-wrapper:after{content:']';right:0}.matrix{display:grid;gap:10px}.cell{text-align:center;min-width:40px;font-size:1.2rem}.symbol{font-size:2rem;font-weight:bold}.answer-grid{display:grid;gap:8px;justify-content:center}.answer-grid input{width:60px;height:50px;text-align:center;background:var(--card);color:var(--text);border:1px solid #cbd5e1;border-radius:8px}button{padding:12px 20px;border:none;border-radius:10px;background:var(--primary);color:#fff;cursor:pointer}.message,.solution{display:none;margin-top:15px;padding:15px;border-radius:10px}.correct{background:#dcfce7;color:#166534}.incorrect{background:#fee2e2;color:#991b1b}@media(max-width:700px){.matrix-layout,.button-row{flex-direction:column}}</style></head><body><canvas id="confettiCanvas"></canvas><div class="container"><div class="card"><h1>Matrix Multiplication Challenge</h1><p class="subtitle">Generate random matrix products and test your skills.</p><div class="stats"><div class="stat">Correct: <span id="correct">0</span></div><div class="stat">Incorrect: <span id="incorrect">0</span></div><div class="stat">Accuracy: <span id="accuracy">0</span>%</div></div><div class="difficulty"><button onclick="setDifficulty('easy')">Easy</button><button onclick="setDifficulty('medium')">Medium</button><button onclick="setDifficulty('hard')">Hard</button></div><div class="matrix-layout"><div id="matrixA"></div><div class="symbol">×</div><div id="matrixB"></div><div class="symbol">=</div><div id="answerInputs"></div></div><div class="button-row"><button onclick="checkAnswer()">Check Answer</button><button onclick="toggleSolution()">Show Worked Solution</button><button onclick="generateQuestion()">New Question</button><button onclick="toggleDarkMode()">🌙 Dark Mode</button></div><div id="message" class="message"></div><div id="solution" class="solution"></div></div></div><script>let matrixA=[],matrixB=[],answer=[],difficulty='easy',correct=0,incorrect=0;function random(a,b){return Math.floor(Math.random()*(b-a+1))+a}function setDifficulty(d){difficulty=d;generateQuestion()}function createMatrix(r,c,min,max){return Array.from({length:r},()=>Array.from({length:c},()=>random(min,max)))}function multiply(A,B){let R=[];for(let i=0;i<A.length;i++){R[i]=[];for(let j=0;j<B[0].length;j++){let s=0;for(let k=0;k<B.length;k++)s+=A[i][k]*B[k][j];R[i][j]=s}}return R}function displayMatrix(m,id){let w=document.createElement('div');w.className='matrix-wrapper';let g=document.createElement('div');g.className='matrix';g.style.gridTemplateColumns='repeat('+m[0].length+',auto)';m.flat().forEach(v=>{let c=document.createElement('div');c.className='cell';c.textContent=v;g.appendChild(c)});w.appendChild(g);let d=document.getElementById(id);d.innerHTML='';d.appendChild(w)}function createAnswerGrid(r,c){let d=document.getElementById('answerInputs');d.className='answer-grid';d.style.gridTemplateColumns='repeat('+c+',60px)';d.innerHTML='';for(let i=0;i<r;i++)for(let j=0;j<c;j++){let b=document.createElement('input');b.type='number';b.dataset.row=i;b.dataset.col=j;d.appendChild(b)}}function generateQuestion(){let min,max,rA,cA,rB,cB;if(difficulty==='hard'){rA=2;cA=3;rB=3;cB=2;min=-9;max=9}else if(difficulty==='medium'){rA=cA=rB=cB=2;min=-5;max=9}else{rA=cA=rB=cB=2;min=0;max=5}matrixA=createMatrix(rA,cA,min,max);matrixB=createMatrix(rB,cB,min,max);answer=multiply(matrixA,matrixB);displayMatrix(matrixA,'matrixA');displayMatrix(matrixB,'matrixB');createAnswerGrid(answer.length,answer[0].length);document.getElementById('message').style.display='none';document.getElementById('solution').style.display='none'}function updateStats(){let t=correct+incorrect;document.getElementById('correct').textContent=correct;document.getElementById('incorrect').textContent=incorrect;document.getElementById('accuracy').textContent=t?Math.round(correct/t*100):0}function checkAnswer(){let ok=true;document.querySelectorAll('#answerInputs input').forEach(i=>{if(Number(i.value)!==answer[i.dataset.row][i.dataset.col])ok=false});let m=document.getElementById('message');if(ok){correct++;m.className='message correct';m.innerHTML='🎉 Correct! Excellent work!';launchConfetti()}else{incorrect++;m.className='message incorrect';m.textContent='✗ Not quite. Try again or view the solution.'}m.style.display='block';updateStats()}function toggleSolution(){let d=document.getElementById('solution');if(d.style.display==='block'){d.style.display='none';return}let h='<h3>Worked Solution</h3>';for(let i=0;i<answer.length;i++)for(let j=0;j<answer[0].length;j++){let t=[];for(let k=0;k<matrixB.length;k++)t.push('('+matrixA[i][k]+' × '+matrixB[k][j]+')');h+='<p>Cell ('+(i+1)+','+(j+1)+'): '+t.join(' + ')+' = <strong>'+answer[i][j]+'</strong></p>'}d.innerHTML=h;d.style.display='block'}function toggleDarkMode(){document.body.classList.toggle('dark');localStorage.setItem('darkMode',document.body.classList.contains('dark'))}if(localStorage.getItem('darkMode')==='true')document.body.classList.add('dark');const canvas=document.getElementById('confettiCanvas'),ctx=canvas.getContext('2d');let particles=[];function resizeCanvas(){canvas.width=innerWidth;canvas.height=innerHeight}addEventListener('resize',resizeCanvas);resizeCanvas();function launchConfetti(){particles=[];for(let i=0;i<150;i++)particles.push({x:canvas.width/2,y:canvas.height/3,size:Math.random()*10+5,sx:(Math.random()-.5)*12,sy:(Math.random()-.5)*12,c:'hsl('+Math.random()*360+',100%,50%)',l:100});(function f(){ctx.clearRect(0,0,canvas.width,canvas.height);particles.forEach(p=>{p.x+=p.sx;p.y+=p.sy;p.sy+=.15;p.l--;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.size,p.size)});particles=particles.filter(p=>p.l>0);if(particles.length)requestAnimationFrame(f)})()}generateQuestion();</script></body></html>
